version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: gym_coach_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gym_coach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: gym_coach_backend
    ports:
      - "8080:8080"
    env_file:
      - ./apps/backend/.env
    depends_on:
      - db

volumes:
  pgdata:
