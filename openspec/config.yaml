schema: spec-driven

context: |
  Projeto: Personal AI Gym Coach
  Tech stack: Monorepo contendo Node.js com Express.js e TypeScript (backend em Cloud Run), PostgreSQL (Supabase), Prisma (ORM), e React/Next.js com TypeScript (frontend em Vercel).
  Integração Futura: O backend será preparado para orquestrar chamadas seguras para a API do Google Gemini.
  Idioma: Todas as especificações, documentações e comentários devem ser redigidos em português do Brasil (pt-BR).
  Testes: Toda nova funcionalidade, módulo ou alteração de código DEVE obrigatoriamente incluir testes unitários abrangentes correspondentes (ex: utilizando Jest no backend).
  Arquitetura e Código: Todos os novos códigos DEVEM seguir os princípios SOLID, em especial o Princípio da Responsabilidade Única (SRP), separando regras de negócio em Services e mantendo Controllers apenas para orquestração da requisição/resposta HTTP.
  Documentação: Todas as novas rotas/controllers DEVEM incluir documentação OpenAPI/Swagger utilizando anotações JSDoc.
